<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyethewizard</title>
    <link rel="icon" href="/res/new_alfakma.webp"/>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6376694717788933" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="\style.css">
</head>
<style>
    .mygames {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* two columns on desktop */
      gap: 25px;
      margin: 20px auto;
      width: 92%;
      max-width: 920px;
    }
    .game {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 12px;
      padding: 10px 15px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }
    .game:hover {
      transform: translateY(-4px);
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
    }
    .game img {
      width: 140px;
      height: 100px;
      border-radius: 10px;
      object-fit: cover;
    }
    .game-info {
      text-align: left;
    }
    .namegame {
      margin: 0;
      font-family: bfdi;
      font-size: 1.3rem;
    }
    .releasedate {
      margin-top: 5px;
      font-size: 0.9rem;
      color: #555;
    }
    @media (max-width: 600px) {
      .mygames {
        grid-template-columns: 1fr;
      }
      .game {
        align-items: center;
        width: 90%;
      }
      .game img {
        width: 120px;
        height: 90px;
      }
      .namegame {
        font-size: 1rem;
      }
      .releasedate {
        font-size: 0.75rem;
      }
    }
</style>
<body>
    <nav class="navbar">
    <div class="logo">
      <img class="icon" src="/res/new_alfakma.webp" alt="Logo">
      <p>Alfakma Jaya</p>
    </div>
    <div class="menu-toggle" id="menu-toggle">
      <div></div>
      <div></div>
    </div>
    <div class="nav-links" id="nav-links">
      <a href="/">Home</a>
      <a href="/games">Games</a>
    </div>
  </nav>
  <main class="hero"  id="home">
  <div class="title" id="games">Games</div>
  <div class="info">Here are the games that i made from 2026:</div>
    <div class="mygames" id="mygames"></div>
  </main>    
  <div class="credit">
    <p>©Keyethewizard 2026</p>
    <a href="feedback/index.html" class="downnav">Feedback</a>
    <a href="https://www.youtube.com/@Keyethewizard" class="downnav">Youtube</a>
  </div>
</body>
<script src="/nav.js"></script>
<script>
    const gamess = [
    { name: "Catch The Fish (in penguinjam results)", src: "/res/smc.webp", link: "https://studio.penguinmod.com/#5983247216", releasedate: "18 Oct 2026", color: "#d6a12b" }
    { name: "Square Run 2048 Clicker (2048 Clicker) (in penguinjam results)", src: "/res/smc.webp", link: "https://studio.penguinmod.com/#8892644900", releasedate: "18 Oct 2026", color: "#d6a12b" }
  ];
    
  const gamesContainer = document.getElementById("mygames");
  gamess.forEach(g => {
    const a = document.createElement("a");
    a.href = g.link;
    a.target = "_blank";
    a.className = "game";
    a.innerHTML = `
      <img src="${g.src}" alt="${g.name}" title="${g.name}">
      <div class="game-info">
        <p class="namegame" style="color: ${g.color};">${g.name}</p>
        <p class="releasedate">${g.releasedate}</p>
      </div>
    `;
    gamesContainer.appendChild(a);
  });
</script>
</html>
